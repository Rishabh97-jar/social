<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fizgamer97</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Space Grotesk',sans-serif;
}

body{
background:#BDEBFF;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
overflow-x:hidden;
}

.container{
width:100%;
max-width:500px;
}

.profile-card{
background:#FFD6E7;
border:4px solid #000;
box-shadow:10px 10px 0 #000;
padding:30px;
text-align:center;
margin-bottom:30px;
border-radius:12px;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
border:4px solid #000;
object-fit:cover;
margin-bottom:15px;
background:#fff;
}

h1{
font-size:2rem;
font-weight:800;
margin-bottom:10px;
}

.bio{
font-size:1rem;
font-weight:600;
}

.links{
display:flex;
flex-direction:column;
gap:20px;
}

.link-btn{
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
color:#000;
font-size:1.1rem;
font-weight:800;
padding:18px;
background:#fff;
border:4px solid #000;
box-shadow:8px 8px 0 #000;
border-radius:12px;
transition:.2s ease;
}

.link-btn:hover{
transform:translate(-4px,-4px);
box-shadow:12px 12px 0 #000;
}

.instagram{
background:#FFD6E7;
}

.youtube{
background:#ffffff;
}

.twitch{
background:#BDEBFF;
}

.contact{
background:#ffe97d;
}

.shape{
position:fixed;
z-index:-1;
border:4px solid #000;
}

.square{
width:90px;
height:90px;
background:#FFD6E7;
top:60px;
left:50px;
transform:rotate(12deg);
}

.circle{
width:100px;
height:100px;
border-radius:50%;
background:#fff;
bottom:80px;
right:60px;
}

@media(max-width:600px){
.profile-card{
padding:25px;
}

.link-btn{
font-size:1rem;
}
}
</style>
</head>
<body>

<div class="shape square"></div>
<div class="shape circle"></div>

<div class="container">

<div class="profile-card">
<img src="Rishabh Kashyap.jpg" class="avatar" alt="Profile">

<h1>Fiz Gamer97</h1>

<p class="bio">
• Small YouTuber • Small Developer 
</p>
</div>

<div class="links">

<a href="https://www.youtube.com/@fizgamer_97"
class="link-btn youtube">
YOUTUBE
</a>

<a href="https://instagram.com/fizgamer_97"
class="link-btn instagram">
INSTAGRAM
</a>

<a href="https://www.twitch.tv/fizgamer_97"
class="link-btn twitch">
TWITCH
</a>

<a href="fizgamer97@gmail.com"
class="link-btn contact">
✉ Contact Me
</a>

</div>

</div>

</body>
</html>
